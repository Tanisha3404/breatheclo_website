<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BreatheClo | Member Login</title>
    <link rel="icon" href="images/Group 4.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css">
</head>
<body>

    <!--login form-->
    <section class="login-section">
        <h2>Login</h2>
        <form action="" class="login-form">
            <div class="input-wrapper full-width">
                <label for="email">EMAIL</label>
                <input type="email" name="email" id="email">
            </div>

            <div class="input-wrapper full-width">
                <label for="pwd">PASSWORD</label>
                <input type="password" name="pwd" id="pwd">
            </div>
            <a href="forgot.html" id="forgot">Forget your password?</a>
            <button type="submit">SIGN IN</button>
            <a href="signin.html" id="create">Create an Account</a>
        </form>
    </section>


    <div id="bc-footer"></div>

    <script src="js/config.js"></script>
    <script src="js/data.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/api.js"></script>
    <script src="js/layout.js"></script>
    <script type="module" src="js/auth.js"></script>
</body>
</html>
